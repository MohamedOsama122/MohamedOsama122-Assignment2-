<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Osama | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: #e0f2fe;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

            .btn-primary:hover {
                background-color: #1d4ed8;
            }

        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

            .btn-secondary:hover {
                background-color: #475569;
            }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">MO</div>
        <h1>Mohamed Osama</h1>
        <span class="badge">Backend .NET Track</span>
        <p>Participant in Simulation Academy .NET Diploma (Cycle 1). Building solid foundational projects and contributing to open-source software.</p>

        <div class="links">
            <a href="https://github.com/MohamedOsama122" target="_blank" class="btn btn-primary">GitHub Profile</a>
            <a href="https://github.com/MohamedOsama122/calculator" target="_blank" class="btn btn-secondary">Calculator Repository</a>
            <a href="https://linkedin.com/" target="_blank" class="btn btn-secondary">LinkedIn Profile</a>
        </div>
    </div>

</body>
</html>
